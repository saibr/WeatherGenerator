# Debug config v2: proper single-batch overfitting experiment.
# Changes from overfit_one_batch.yml:
#
#  1. samples_per_mini_epoch: 1  — one gradient step per mini_epoch.
#     Training loss is now logged at bidx=0 thanks to the fix in trainer.py
#     (_log_terminal no longer requires bidx > 0).
#
#  2. ALL dropout rates: 0.0  — removes all stochastic regularization.
#
#  3. weight_decay: 0.0  — removes L2 regularization.
#
#  4. fe_impute_latent_noise_std: 0.0  — deterministic forward passes.
#     (default_config.yml already has 0.0; this was accidentally set to 1e-4.)
#
#  5. Adam betas corrected for single GPU:
#     beta1: 0.98125 == 0.85^(1/8) was for 8-GPU DDP.  Standard beta1=0.9.
#
#  6. lr_max: 1e-4  — reduced from 5e-4 to prevent gradient overshoot spikes.
#     Runs b82tuo1b / v57k4j0f / vvo8y4t0 all showed repeated loss spikes
#     (worst: +840% at epoch 241 in v57k4j0f) with lr_max=5e-4+constant schedule.
#
#  7. num_steps: 1  — simplest forecasting task (predict t+6h only).
#
#  8. fe_layer_norm_after_blocks: []  — [7] was a dead index (only 6 blocks: 0-5).
#
#  9. num_mini_epochs: 3000  — increased to compensate for lower lr_max.
#
# Stream-level change required (NOT overrideable from here):
#  - In config/streams/era5_n320/era5.yml and cerra/cerra.yml set:
#      max_num_targets: -1
#    (use all target points; the current 270k random subsample re-rolls every
#     epoch via rng.choice, making the loss surface change each step.)
#
