# CERRA 2-step forecasting fine-tuning with WFCL as the ONLY training loss: CERRA decoder only; full encoder frozen;
# CERRA target only (diagnostic). Self-contained: = config_cerra_ft_decoder_cerratarget_fc2.yml
# + the WFCL loss (Wavelet-Fourier Composite Loss, An et al. 2026, doi:10.1038/s41612-026-01472-y)
# from wael-mika/WeatherGenerator branch wm/wfcl-loss-cerra (LossSpectralWFCL), MSE switched off.
#
# Overlay on sdnbfpve (train_continue). CERRA is a TARGET only (diagnostic: true): it is never
# fed to the encoder, so no CERRA input embedder is built. Only the new CERRA decoder trains;
# the full encoder, forecast engine and ERA5 decoder are frozen.
# Forecasting variant of config_cerra_wfcl_only.yml (that one is autoencoding): 2 forecast
# steps of 6h, WFCL on all 8 CERRA target channels at both steps.
# Everything not set here (architecture, other streams,
# train 2016-2022 / val 2023-10..12) is inherited from sdnbfpve.
#
# Launch (no second --config needed):
#   ../WeatherGenerator-private/hpc/launch-slurm.py --stage train --from-run-id sdnbfpve --nodes 1 \
#       --no-register --account wghack-course2026-cscs --wgen-dir $(pwd) \
#       --config config/cerra_finetune/config_cerra_wfcl_only_fc2.yml \
#       --options data_loading.rng_seed=42
#
# Loss setup:
#  - "forecast" (the MSE term inherited from sdnbfpve) gets weight 0: it is still computed and
#    logged for monitoring, but contributes no gradient (loss_calculator skips weight <= 0).
#    This also removes the ERA5 MSE; harmless here because the encoder and ERA5 decoder are frozen.
#  - no "physical" block: in sdnbfpve it is disabled and would add a second MSE term.
#  - wfcl weight 1.0 (no other term to balance against).
#  - p_min 0.5: without MSE, P_t -> 0 would leave only AMPLITUDE terms at the end of training,
#    which do not constrain where structures are (phase). The loss docstring recommends p_min > 0
#    when WFCL is used without MSE.
#  - all 8 CERRA target channels: channels not listed would get no gradient at all.
#  - the outer 22-23 rows/columns of the 1069 x 1069 grid are outside the 64 x 64 tiles and get
#    no gradient.

# Forecasting: the frozen forecast engine IS applied (2 x 6h steps).
bypass_forecast_engine: false

freeze_modules: 'encoder|forecast_engine|embed_target_coords_ERA5|TargetPredictionEngine_ERA5|EnsPredictionHead_ERA5'

general:
  istep: 0  # restart step counter / LR schedule (sdnbfpve stopped at 1168)
  desc: "cerra_finetune FC2 dec_cerratarget_fc2_wfcl_only: 2 x 6h forecast; CERRA decoder only; full encoder frozen; CERRA target only (diagnostic); WFCL only"

training_config:
  num_mini_epochs: 4
  samples_per_mini_epoch: 4096
  learning_rate_scheduling:
    # same LR for all runs so the comparison is fair; 1e-4 is too high for the 610M encoder
    lr_max: 3.0e-5
    num_steps_warmup: 64
    num_steps_cooldown: 128
    # sdnbfpve used the old spelling "const", which the scheduler no longer accepts
    parallel_scaling_policy: "constant"
  losses:
    forecast:
      weight: 0.0
    wfcl:
      type: LossSpectralWFCL
      weight: 1.0
      loss_fcts:
        wfcl:
          target_stream: CERRA
          # only `latitudes`/`longitudes` are read, to map target points back onto the raster
          grid_zarr: /capstor/store/cscs/userlab/ch17/data/cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr
          grid: raster
          grid_shape: [1069, 1069]
          # 64 x 64 native tiles (5.5 km pixels, ~350 km); must be divisible by 2**J
          patch_size: 64
          channels: ['2t', '10si', 'msl', 'r_850', 't_850', 'u_850', 'v_850', 'z_850']
          J: 3
          beta: 1.0
          gamma: [1.0, 1.0, 1.0]
          alpha: 0.1
          p_min: 0.5
          # P_t schedule over this run's optimiser steps (istep restarts at 0):
          # 4 mini epochs x 4096 samples / (4 GPUs x 1 sample per GPU) = 4096 steps (1 node).
          # Update this if num_mini_epochs, samples_per_mini_epoch or the GPU count change
          # (e.g. 2 nodes / 8 GPUs -> 2048).
          schedule_start_step: 0
          total_steps: 2048
          biort: near_sym_b
          qshift: qshift_b

  # forecasting fine-tune: 2 forecast steps of 6h (+6h, +12h); loss on both steps
  forecast:
      time_step: 06:00:00
      offset: 1
      num_steps: 2
      policy: "fixed"

validation_config:
  validate_before_training: false

wgtags:
  exp: cerra_finetune
  grid: dec_cerratarget_fc2
  loss: wfcl_only

streams:
  CERRA:
    name: CERRA
    type: anemoi
    filenames: ['cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2.zarr']
    stream_id: 42  # unused by sdnbfpve
    diagnostic: true  # target only, not model input
    # 6h windows / 6h forecast steps (like ERA5_in): one CERRA analysis per window
    frequency: "06:00:00"
    source: ['skt', 'sp', '10si', '10wdir', '2r', '2t', 'msl', 'r_100', 'r_1000', 'r_150', 'r_200', 'r_250', 'r_300', 'r_400', 'r_50', 'r_500', 'r_600', 'r_700', 'r_850', 'r_925', 't_100', 't_1000', 't_150', 't_200', 't_250', 't_300', 't_400', 't_50', 't_500', 't_600', 't_700', 't_850', 't_925', 'u_100', 'u_1000', 'u_150', 'u_200', 'u_250', 'u_300', 'u_400', 'u_50', 'u_500', 'u_600', 'u_700', 'u_850', 'u_925', 'v_100', 'v_1000', 'v_150', 'v_200', 'v_250', 'v_300', 'v_400', 'v_50', 'v_500', 'v_600', 'v_700', 'v_850', 'v_925', 'z_100', 'z_1000', 'z_150', 'z_200', 'z_250', 'z_300', 'z_400', 'z_50', 'z_500', 'z_600', 'z_700', 'z_850', 'z_925']
    target: ['2t', '10si', 'msl', 'r_850', 't_850', 'u_850', 'v_850', 'z_850']
    geoinfo_channels: ['insolation', 'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day']
    loss_weight: 1.0
    token_size: 512
    # spectral losses need the COMPLETE CERRA field (1,142,761 points) at every forecast step,
    # in training and validation; a subsampled target raises an error.
    max_num_targets: -1
    embed:  # only built/used when diagnostic: false
      net: transformer
      num_tokens: 1
      num_heads: 8
      dim_embed: 512
      num_blocks: 2
    embed_target_coords:
      net: linear
      dim_embed: 512
    target_readout:
      num_layers: 2
      num_heads: 4
    pred_head:
      ens_size: 1
      num_layers: 1
