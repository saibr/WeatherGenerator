evaluation:
  metrics  : 
    - psd:
        psd_method: "fft"                    # "sht" (SHT-based) or "fft" (regrid FFT)
        psd_regrid_resolution: 1.0           # degrees, only for fft method
        grid_type: "octahedral"              # "octahedral" (default), "regular", "reduced".
  summary_plots : true
  ratio_plots : true

default_streams:
  CERRA:
    channels: ["2t", "2r", "r_1000", "10si", "10wdir", "r_850", "t_850", "u_850", "v_850", "z_500", "msl"] #, "blah"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    plotting:
      sample: [0] #,1,2,3,4,5,6,7]
      forecast_step: [1] 
      ensemble: "mean"
      plot_maps: true
      plot_bias: true
      plot_target: true
      plot_histograms: true
      plot_animations: true

