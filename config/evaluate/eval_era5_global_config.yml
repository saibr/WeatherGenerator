
global_plotting_options:
 regions: ["global"]
 image_format : "png" #options: "png", "pdf", "svg", "eps", "jpg" ..
 dpi_val : 300
 fps: 2
 ERA5:
   marker_size: 2
   scale_marker_size: 1
   marker: "o"

evaluation:
  metrics  : ["rmse","bias","mae"]
  regions: ["global"]
  summary_plots : true
  ratio_plots : false
  heat_maps : false
  summary_dir: "./plots/"
  plot_ensemble: false #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: false
  num_processes: 0 #options: int, "auto", 0 means no parallelism (default)

default_streams:
  ERA5:
    channels: ["2t", "10u", "10v", "q_850", "t_850", "u_850", "v_850", "z_500"] #, "10v", "z_500", "t_850", "u_850", "v_850", "q_850", ]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all" 
    plotting:
      sample: [0]
      forecast_step: [1,3,5,7] 
      ensemble: "mean" 
      plot_maps: true
      plot_bias: false
      plot_target: true
      plot_histograms: false
      plot_animations: true
      
run_ids :
  xxx:
    label: