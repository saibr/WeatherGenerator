
global_plotting_options:
 regions: ["europe"]
 image_format : "png" 
 dpi_val : 300
 fps: 2

evaluation:
  metrics  : ["rmse","bias","mae"]
  regions: ["europe"]
  summary_plots : true
  ratio_plots : true
  heat_maps : true
  summary_dir: "./plots/MF_KNMI/ERA5_CERRA_experiments/eval_plots/loss_weights"
  plot_ensemble: false #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: true
  num_processes: "auto"  #options: int, "auto", 0 means no parallelism (default)
  
default_streams:
  CERRA:
    channels: ["2t", "2r", "r_1000", "10si", "10wdir", "r_850", "t_850", "u_850", "v_850", "z_500", "msl"] #, "blah"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "all"
    plotting:
      sample: [0,16]
      forecast_step: [1,3,5,7,9] 
      ensemble: "mean"
      plot_maps: true
      plot_bias: true
      plot_target: true
      plot_histograms: true
      plot_animations: true
      
run_ids :
  sch9wo4j:
    label: "all lw = 1"
  pe9nh7vp:
    label: "ERA5.lw=1 - CERRA.lw=2"
  er9vbcqw:
    label: "ERA5.lw=2 - CERRA.lw=1"
  nh9rtc8n :
    label: "ERA5.lw=0.97 - CERRA.lw=0.03"