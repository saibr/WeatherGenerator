
global_plotting_options:
 regions: ["arome"]
 image_format : "png" 
 dpi_val : 300
 fps: 2

evaluation:
  metrics  : ["rmse","bias","mae"]
  regions: ["arome"]
  summary_plots : true
  ratio_plots : true
  heat_maps : true
  summary_dir: "./plots/MF/eval_plots/"
  plot_ensemble: false #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: true
  num_processes: "auto"  #options: int, "auto", 0 means no parallelism (default)

default_streams:
  TITAN:
    channels: ["tp", "2t", "q_1000", "10u", "10v", "q_850", "t_850", "u_850", "v_850", "z_500", "msl"] #, "blah"]
    evaluation:
      forecast_step: "all"
      sample: "all"
      ensemble: "mean"
    plotting:
      sample: "all"
      forecast_step: "all" 
      ensemble: "mean"
      plot_maps: true
      plot_bias: true
      plot_target: true
      plot_histograms: true
      plot_animations: true
      
run_ids :
  l16ib2vf:
    label: "Titan"