
global_plotting_options:
 regions: ["cerra"]
 image_format : "png" 
 dpi_val : 500
 fps: 2

evaluation:
  metrics  :
    - psd:
        psd_method: "fft"    
  regions: ["cerra"]
  summary_plots : true
  ratio_plots : true
  heat_maps : false
  summary_dir: "./plots/KNMI/eval_plots/psd_cerra_8"
  plot_ensemble: false #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: false
  score_cards: false
  bar_plots: true
  num_processes: "auto"  #options: int, "auto", 0 means no parallelism (default)
  
  
default_streams:
  CERRA_OUT_1:
    channels: ['2r','10si','r_100', 'r_850', 't_100', 't_850', 'u_100', 'u_850', 'v_100', 'v_850', 'z_100', 'z_850']
    evaluation:
