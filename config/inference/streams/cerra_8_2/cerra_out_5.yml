CERRA_OUT_5 :
  type : anemoi
  anemoi_config:
    dataset: 'cerra-rr-an-oper-se-al-ec-mars-5p5km-1985-2023-3h-v2'
    trim_edge: 100 #755161 for 100, 470k points left for 200
  stream_id : 1
  frequency : 3h
  source : []
  target : ['t_100']
  geoinfo_channels : [ 'insolation',
                       'cos_local_time', 'sin_local_time', 'cos_julian_day', 'sin_julian_day',
                      #  'cos_latitude', 'cos_longitude',
                      #  'sin_latitude', 'sin_longitude',
                       ]
  loss_weight : 1.
  token_size : 32
  diagnostic : True
  max_num_targets: -1 #375000 #131072 #131072 # 262144   #131072 # 65536 #32768 #8192
  embed : 
    net : transformer
    num_tokens : 1
    num_heads : 8
    dim_embed : 512
    num_blocks : 2
  # pred_spatial_shared: ERA5
  embed_target_coords :
    net : linear
    dim_embed : 512
  target_readout :
    type : 'obs_value'
    num_layers : 2
    num_heads : 4
  pred_head :
    ens_size : 1
    num_layers : 1